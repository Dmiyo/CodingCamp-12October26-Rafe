<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todolist-By.Revou</title>
</head>
<body>
    <!-- Dekorasi Background (Blob) agar efek kaca terlihat -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>


    <div class="dashboard">
        <!-- Header Dashboard dengan Tombol Toggle -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">To-Do List Life</h1>
            
            <!-- TOMBOL GANTI MODE -->
            <div class="header-controls">
                <!-- Tombol Login (Hanya muncul jika belum login) -->
                <button id="header-login-btn" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="openAuthModal('login')">
                    Log In
                </button>

                <!-- Info User & Tombol Logout (Hanya muncul jika sudah login) -->
                <div id="user-profile" class="user-profile hidden">
                    <span id="user-name-display" class="user-name">User</span>
                    <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="handleLogout()">
                        Log Out
                    </button>
                </div>

                <!-- Toggle Tema -->
                <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                <label for="theme-toggle" class="theme-toggle-label">
                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>
                    <div class="toggle-ball"></div>
                </label>
            </div>
        </div>
        
        <!-- 1. Area Greeting -->
        <div class="card greeting-card glass-panel">
            <div class="clock-time" id="clock">10:45:22</div>
            <div class="clock-date" id="date">Tuesday, January 27, 2026</div>
            <div class="greeting-text" id="greeting">Good Morning</div>
        </div>

        <!-- 2. Focus Timer -->
        <div class="card timer-card glass-panel">
            <h2 class="card-title">Timer</h2>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button class="btn btn-primary" id="btn-start">Start</button>
                <button class="btn btn-secondary" id="btn-stop">Stop</button>
                <button class="btn btn-secondary" id="btn-reset">Reset</button>
            </div>
        </div>

        <!-- 3. Tasks (To-Do List) -->
        <div class="card tasks-card">
            <h2 class="card-title">Tasks</h2>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button class="btn btn-primary" id="btn-add-task">Add</button>
            </div>
            <!-- Tambahkan class scrollable-area di sini -->
            <div class="scrollable-area">
                <ul class="task-list" id="task-list">
                </ul>
            </div>
        </div>

        <!-- 4. Quick Links -->
        <div class="card links-card glass-panel">
            <h2 class="card-title" style="text-align: left;">Quick Links</h2>
            <div class="link-input-group">
                <input type="text" id="link-name" placeholder="Link name">
                <input type="url" id="link-url" placeholder="URL">
                <button class="btn btn-primary" id="btn-add-link">Add Link</button>
            </div>
            <div class="quick-links-list" id="quick-links-list">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
